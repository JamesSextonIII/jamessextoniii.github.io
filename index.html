<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James Sexton III | Data Analyst</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #2d323e 0%, #121418 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .office-frame {
            width: 95vw;
            max-width: 1500px;
            height: 90vh; 
            border: 4px solid #434c5e; 
            border-radius: 12px; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.5);
            
            overflow-x: auto; 
            overflow-y: hidden; 
            /* Hide scrollbar for IE, Edge and Firefox */
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .office-frame::-webkit-scrollbar {
            display: none;
        }

        .office-scene {
            height: 100%;
            aspect-ratio: 16 / 9; 
            background-image: url('assets/cubicle-bg-1.0.webp'); 
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            
            /* Indicate the area is draggable */
            cursor: grab;
        }
        
        /* Change cursor when actively dragging */
        .office-scene:active {
            cursor: grabbing;
        }

        @media (max-width: 768px) {
            .office-frame {
                height: 85vh; 
            }
            .office-scene {
                /* Ensures the image stays wide enough to drag on mobile */
                min-width: 200vw; 
            }
        }
    </style>
</head>
<body>
    
    <div class="office-frame" id="officeFrame">
        <div class="office-scene" id="officeScene">
            
            <!-- Clickable zones will go here -->
            
        </div>
    </div>

    <!-- Mouse and Touch Dragging Script -->
    <script>
        const slider = document.getElementById('officeFrame');
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        
        slider.addEventListener('mouseleave', () => {
            isDown = false;
        });
        
        slider.addEventListener('mouseup', () => {
            isDown = false;
        });
        
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault(); // Prevents accidental text/image highlighting
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; // The * 2 determines scroll speed/sensitivity
            slider.scrollLeft = scrollLeft - walk;
        });
    </script>
</body>
</html>
