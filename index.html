<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James Sexton III | Data Analyst</title>
    <style>
    body {
        margin: 0;
        padding: 0;
        /* Swaps the flat black for a modern, premium dark slate gradient */
        background: radial-gradient(circle at top, #2d323e 0%, #121418 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    
    .office-container {
        position: relative;
        /* Scales the image up to fill 95% of the screen width or 90% of the height */
        width: 95vw;
        max-width: 1500px;
        max-height: 90vh;
        aspect-ratio: 16 / 9;
        
        /* Ensure your extension here matches what you uploaded (.webp or .jpg) */
        background-image: url('main/assets/images/cubicle-bg-1.0.webp'); 
        
        /* Cover ensures the image stretches flush to the new borders */
        background-size: cover; 
        background-repeat: no-repeat;
        background-position: center;
        
        /* The UI Touch: A clean slate-grey frame, rounded corners, and deep shadow */
        border: 4px solid #434c5e; 
        border-radius: 12px; 
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.5);
    }
</style>
</head>
<body>
    <!-- The background image loads here -->
    <div class="office-container">

        <!-- We will add the clickable invisible buttons for the folders, monitor, and cabinet here next -->

    </div>
</body>
</html>
