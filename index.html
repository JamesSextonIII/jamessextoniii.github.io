<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James Sexton III | Data Analyst</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #2d323e 0%, #121418 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* The Outer Frame: Keeps the border and shadow, stays fixed on screen */
        .office-frame {
            width: 95vw;
            max-width: 1500px;
            height: 90vh; 
            border: 4px solid #434c5e; 
            border-radius: 12px; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.5);
            
            /* Magic trick: Enables horizontal swiping inside the frame on mobile */
            overflow-x: auto; 
            overflow-y: hidden; 
            -webkit-overflow-scrolling: touch; /* Smooth swiping on phones */
        }

        /* The Inner Image: Holds its shape so nothing gets cropped out permanently */
        .office-scene {
            height: 100%;
            aspect-ratio: 16 / 9; /* Maintains the original widescreen shape */
            
            background-image: url('assets/cubicle-bg-1.0.webp'); 
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
        }

        /* --- MOBILE PANNING FIX --- */
        @media (max-width: 768px) {
            .office-frame {
                height: 85vh; /* Slightly shorter to account for mobile browser bars */
            }
            .office-scene {
                /* Forces the image to stay wide on mobile so objects stay large. 
                   Because it's wider than the screen, it triggers the scroll/swipe! */
                min-width: 200vw; 
            }
        }
    </style>
</head>
<body>
    
    <!-- We now have a Frame that holds the Scene -->
    <div class="office-frame">
        <div class="office-scene">
            
            <!-- We will map our SVG click zones over this div next -->
            
        </div>
    </div>
    
</body>
</html>
