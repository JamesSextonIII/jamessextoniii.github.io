<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Added maximum-scale to prevent accidental double-tap zooming on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>James Sexton III | Data Analyst</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #2d323e 0%, #121418 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* dvh fixes the awkward address bar gap on mobile browsers */
            height: 100dvh; 
            overflow: hidden;
        }
        
        .office-frame {
            width: 95vw;
            max-width: 1500px;
            height: 90vh; 
            border: 4px solid #434c5e; 
            border-radius: 12px; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.5);
            
            overflow-x: auto; 
            overflow-y: hidden; 
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }

        .office-frame::-webkit-scrollbar {
            display: none;
        }

        .office-scene {
            height: 100%;
            aspect-ratio: 16 / 9; 
            background-image: url('assets/cubicle-bg-1.0.webp'); 
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            cursor: grab;
        }
        
        .office-scene:active {
            cursor: grabbing;
        }

        @media (max-width: 768px) {
            .office-frame {
                height: 95vh; 
                height: 95dvh; /* Expands to fill almost the whole screen minus a neat margin */
            }
            .office-scene {
                /* Increased slightly to ensure the sides don't get cropped when the frame gets taller */
                min-width: 240vw; 
            }
        }
    </style>
</head>
<body>
    
    <div class="office-frame" id="officeFrame">
        <div class="office-scene" id="officeScene">
            
            <!-- Clickable zones will go here -->
            
        </div>
    </div>

    <script>
        const slider = document.getElementById('officeFrame');
        
        // --- NEW: Center the image on load ---
        window.addEventListener('load', () => {
            // Calculates the exact middle of the scrollable area and jumps to it
            slider.scrollLeft = (slider.scrollWidth - slider.clientWidth) / 2;
        });

        // --- Mouse Dragging Script ---
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        
        slider.addEventListener('mouseleave', () => {
            isDown = false;
        });
        
        slider.addEventListener('mouseup', () => {
            isDown = false;
        });
        
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault(); 
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; 
            slider.scrollLeft = scrollLeft - walk;
        });
    </script>
</body>
</html>
